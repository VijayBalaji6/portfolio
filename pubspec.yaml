name: portfolio
description: "My portfolio"

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^4.0.0
  firebase_storage: ^13.0.0
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.0-dev.3
  riverpod_annotation: ^3.0.0-dev.3
  flutter_svg: ^2.2.0
  url_launcher: ^6.3.2
  web: ^1.1.1
  go_router: ^16.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^3.0.0-dev.11
  riverpod_lint: ^3.0.0-dev.4

flutter:
  uses-material-design: true
  assets:
    - assets/splash/
    - assets/home/
    - assets/contact/
    - assets/skills/
